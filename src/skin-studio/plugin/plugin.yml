name: SkinStudioPlugin
version: 1.0.0
main: com.skinstudio.plugin.SkinStudioPlugin
api-version: 1.20
author: SkinStudio
description: Real-time skin synchronization plugin for Minecraft Java servers.

commands:
  skin:
    description: Apply or reset skins directly from Skin Studio web platform.
    usage: /<command> [id|set|reset|help]
    aliases: [skins, skinstudio]
    permission: skinstudio.use
    permission-message: You do not have permission to use Skin Studio commands.

permissions:
  skinstudio.use:
    description: Allows players to apply skins from Skin Studio.
    default: true
  skinstudio.admin:
    description: Allows configuring Skin Studio plugin settings.
    default: op
